[build-system]
requires = [
    "setuptools >= 64",
    "setuptools_scm[toml] >= 6",
    "wheel >= 0.29.0",
]
build-backend = 'setuptools.build_meta'

[project]
name = "echodataflow"
description = "Echosounder data processing pipeline orchestration"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [
    { name = "Wu-Jung Lee", email = "leewujung@gmail.com" },
    { name = "Soham Butala", email = "sohambutala7@gmail.com" },
    { name = "Landung Setiawan", email = "landungs@uw.edu" },
]
maintainers = [
    { name = "Wu-Jung Lee", email = "leewujung@gmail.com" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Build Tools",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "boto3",
    "bokeh",
    "cartopy",
    "geopandas",
    "geopy",
    "geoviews",
    "holoviews",
    "matplotlib",
    "numpy",
    "openpyxl",
    "pandas",
    "panel",
    "prefect[shell,dask]==3.8.4",
    "PyYAML",
    "s3fs",
    "shapely",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "watchdog",
    "xarray",
]
dynamic = ["version"]

[project.optional-dependencies]
mission = [
    "echopype @ git+https://github.com/echostack-org/echopype.git",
    "echoshader @ git+https://github.com/echostack-org/echoshader.git",
    "echoregions @ git+https://github.com/echostack-org/echoregions.git",
    "opencv-python",
    "dask-image",
    "torch",
]

notebook = [
    "ipykernel",
]

test = [
    "pytest",
    "pytest-cov",
    "pytest-xdist",
    "pytest-mock",
]

lint = [
    "black",
    "check-manifest",
    "flake8",
    "flake8-builtins",
    "flake8-comprehensions",
    "flake8-mutable",
    "flake8-print",
    "isort",
    "mypy",
    "numpydoc",
    "pre-commit",
    "pylint",
]

docs = [
    "jupyter-book",
    "matplotlib",
    "nbsphinx",
    "recommonmark",
    "sphinx",
    "sphinx-automodapi",
]

[project.scripts]
echodataflow-deploy = "echodataflow.deployment.deploy_cli:main"

[project.urls]
Homepage = "https://github.com/echostack-org/echodataflow"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools_scm]
fallback_version = "0.0.0"
local_scheme = "no-local-version"

[tool.black]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src/echodataflow --cov-report=term --cov-report=xml"
filterwarnings = [
    "ignore::DeprecationWarning"
]

[tool.coverage.report]
include_namespace_packages = true

[tool.coverage.run]
omit = [
    "*/tests/*",
    "*/__init__.py",
    "*/docs/*"
]
