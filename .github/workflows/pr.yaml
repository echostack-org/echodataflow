name: Test PR

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  tests:
    name: Python 3.12 tests
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test,mission]"

      - name: Run tests
        run: |
          python -m pytest -vv \
            --ignore=tests/test_operations_predict_hake.py \
            --ignore=tests/test_postprocessing_flow_validation.py
