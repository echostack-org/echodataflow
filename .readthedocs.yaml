version: 2

build:
  os: ubuntu-lts-latest
  tools:
    python: "3.12"
    nodejs: "22"
  jobs:
    install:
      - python -m pip install --upgrade -r docs/requirements.txt
    build:
      html:
        - cd docs && BASE_URL="/$READTHEDOCS_LANGUAGE/$READTHEDOCS_VERSION" python -m jupyter_book build --html --strict
    post_build:
      - mkdir --parents "$READTHEDOCS_OUTPUT/html/"
      - cp --recursive docs/_build/html/. "$READTHEDOCS_OUTPUT/html/"

formats: []
